name: Render video Nahwu

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependensi sistem untuk Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg

      - name: Install npm packages
        run: npm ci

      - name: Cek tipe TypeScript
        run: npm run typecheck

      - name: Siapkan browser Remotion
        run: npx remotion browser ensure

      - name: Render MP4 (1080x1920, 30 FPS)
        run: npm run render

      - name: Simpan hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nahwu-mp4
          path: out/nahwu.mp4
          retention-days: 14
